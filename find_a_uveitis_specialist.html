<style>
  :root{ --teal:#1f5c5c; --teal-d:#164545; --ink:#22303a; --muted:#5f727c; --line:#e2e8ea; --bg:#f6f8f8; --amber:#b26a00; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100vh}
  header{background:var(--teal);color:#fff;padding:14px 22px;flex:none}
  header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:12.5px;color:#bfe0e0}
  #main{display:flex;flex:1;min-height:0}
  #panel{width:390px;max-width:42%;display:flex;flex-direction:column;border-right:1px solid var(--line);background:#fff}
  #searchwrap{padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
  #search{width:100%;padding:11px 13px;font-size:15px;border:1.5px solid var(--line);border-radius:8px;outline:none}
  #search:focus{border-color:var(--teal)}
  #count{padding:9px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);flex:none}
  #count b{color:var(--ink)}
  #list{overflow-y:auto;flex:1}
  .card{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .card:hover{background:#f0f6f6}
  .card.active{background:#e6f1f1;border-left:3px solid var(--teal);padding-left:13px}
  .card .nm{font-weight:700;font-size:14.5px}
  .card .og{font-size:13px;color:var(--muted);margin-top:1px}
  .card .lo{font-size:12.5px;color:var(--ink);margin-top:3px}
  .card a{color:var(--teal);font-size:12.5px;text-decoration:none}
  .card a:hover{text-decoration:underline}
  .tag{display:inline-block;font-size:11px;color:var(--amber);background:#fbeedc;border-radius:4px;padding:1px 6px;margin-top:4px}
  #map{flex:1;min-height:0}
  .leaflet-popup-content{font-size:13px;line-height:1.45}
  .leaflet-popup-content b{font-size:14px}
  #empty{padding:26px 16px;color:var(--muted);font-size:13.5px;display:none}
  @media(max-width:760px){
    #main{flex-direction:column}
    #panel{width:100%;max-width:none;height:48%}
    #map{height:52%}
  }
</style>
</head>

const map = L.map('map',{scrollWheelZoom:true}).setView([39.5,-98.35],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:18, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);

const markers = {};
MEMBERS.forEach((m,i)=>{
  if(m.lat==null) return;
  const mk = L.circleMarker([m.lat,m.lon],{
    radius:7, color:'#164545', weight:1.5, fillColor:'#1f5c5c', fillOpacity:.75
  }).addTo(map);
  const site = m.website ? `<br><a href="${/^https?:/.test(m.website)?m.website:'https://'+m.website}" target="_blank" rel="noopener">${m.website.replace(/^https?:\/\//,'')}</a>` : '';
  const ph = m.phone ? `<br>${m.phone}` : '';
  mk.bindPopup(`<b>${m.name}</b><br>${m.org||''}<br>${[m.city,m.state].filter(Boolean).join(', ')}${ph}${site}`);
  markers[i]=mk;
});

const listEl=document.getElementById('list');
const countEl=document.getElementById('count');
const emptyEl=document.getElementById('empty');
const searchEl=document.getElementById('search');

function render(q){
  q=q.trim().toLowerCase();
  const matches=[];
  MEMBERS.forEach((m,i)=>{
    const hay=[m.name,m.org,m.city,m.state,m.zip,m.country].join(' ').toLowerCase();
    if(!q || hay.includes(q)) matches.push(i);
  });
  listEl.innerHTML='';
  const mapped=matches.filter(i=>MEMBERS[i].lat!=null).length;
  emptyEl.style.display = matches.length? 'none':'block';
  countEl.innerHTML = `<b>${matches.length}</b> specialist${matches.length===1?'':'s'} &middot; ${mapped} shown on map`;

  matches.forEach(i=>{
    const m=MEMBERS[i];
    const c=document.createElement('div');
    c.className='card';
    const site = m.website ? `<a href="${/^https?:/.test(m.website)?m.website:'https://'+m.website}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${m.website.replace(/^https?:\/\//,'')}</a>` : '';
    const tag = m.lat==null ? `<div class="tag">Location not mapped</div>` : '';
    c.innerHTML=`<div class="nm">${m.name}</div>
      <div class="og">${m.org||''}</div>
      <div class="lo">${[m.city,m.state].filter(Boolean).join(', ')} ${m.zip||''}</div>
      ${site} ${tag}`;
    c.onclick=()=>{
      document.querySelectorAll('.card.active').forEach(e=>e.classList.remove('active'));
      c.classList.add('active');
      if(markers[i]){ map.setView([m.lat,m.lon],11); markers[i].openPopup(); }
    };
    listEl.appendChild(c);
  });

  // fit map to matches when searching
  const pts=matches.filter(i=>MEMBERS[i].lat!=null).map(i=>[MEMBERS[i].lat,MEMBERS[i].lon]);
  if(q && pts.length){ map.fitBounds(pts,{padding:[40,40],maxZoom:11}); }
  else if(!q){ map.setView([39.5,-98.35],4); }
}
searchEl.addEventListener('input',e=>render(e.target.value));
render('');
</script>
</body>
</html>
